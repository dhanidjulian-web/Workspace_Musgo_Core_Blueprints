# ============================================================
# MusGo-OS 2in1 — CANONICAL WORKFLOW & ORCHESTRATION CONFIG
# File    : /home/Project-Progress/config/canonical_workflow.yaml
# Sumber  : PROMPT "Setiap Founder/user input harus di-response dengan
#           canonical workflow steps berurutan sesuai abjad dan nomor"
#           + ROLE / MISSION / OPERATIONAL WORKFLOW / OUTPUT STRUCTURE
# ============================================================

version: "1.0.0"
ordering: "abjad_dan_nomor"      # A,B,C,D lalu 1,2,3,4
fail_fast: true                  # step gagal -> STOP, laporkan, jangan lanjut
require_founder_approval: true   # sebelum SWARM dieksekusi

# ------------------------------------------------------------------
# PHASE A — GROUNDING (wajib di awal SETIAP sesi/tugas)
# ------------------------------------------------------------------
phase_a_grounding:
  A1_analisa_dir_path:
    path_key: project_progress
    goal: "Kenali lokasi kerja + isi direktori nyata"
    actions:
      - "load paths.yaml (resolver)"
      - "list direktori Project-Progress (config, memory, knowledge, runtime, .state)"
      - "detect file sesi terakhir"
    output: "workspace_snapshot"
  A2_load_memory:
    sources:
      - "{memory}/MEMORY_INDEX.md"
      - "{memory}/SESSION_INDEX.md"
      - "{state}/current_session.json"
    output: "memory_snapshot"
  A3_load_knowledge:
    sources:
      - "{knowledge}/KNOWLEDGE_INDEX.md"
      - "{knowledge}/PROJECT_STATE.md"
      - "{knowledge}/GLOSSARY.md"
      - "{knowledge}/OPEN_QUESTIONS.md"
    output: "knowledge_snapshot"
  A4_load_last_progress:
    sources:
      - "{knowledge}/PROGRESS_LOG.md"     # 50 entri terakhir
    output: "progress_snapshot"
  A5_load_goal_destination:
    sources:
      - "{knowledge}/PROJECT_STATE.md#tujuan_project"
      - "prompt_instruction (Tujuan Project)"
    output: "goal_snapshot"
  A6_grounding_bundle:
    sources:                            # §2 wajib grounding
      - "{blueprints_index}"
      - "{blueprints_agent_index}"
      - "{agents_skills_index}"
      - "{agent_files_root}"
      - "{memory}"
      - "{knowledge}"
      - "{repo_root}"
    rule: "Semua referensi agent/skill WAJIB berasal dari sini, dilarang mengarang."

# ------------------------------------------------------------------
# PHASE B — ORCHESTRATION LOOP (§6 A-D)
# ------------------------------------------------------------------
phase_b_orchestration:
  B1_task_decomposition:
    dimensions: [technical, strategic, operational]
    output_fields: [objective, hidden_objective, dependency, constraint,
                    attack_surface, operational_impact]
  B2_multi_dimensional_mapping:
    scan_index: "{agents_skills_index}"
    criteria:
      - "criteria_type"        # Backend, Security, Research, Creative, ...
      - "category_module"      # AI Governance, Infrastructure, Cybersecurity, ...
      - "level_environment"    # Senior/Expert, Cloud/Local
      - "goal_alignment"       # 0-100 skor
    min_goal_alignment: 60
    max_pairs_per_task: 3            # sesuai router auto_agent.yaml
    fallback_group: 0                # koleksi eksternal jika tidak ada match
  B3_agent_skill_pairing:
    duality_enforced: true          # WAJIB pair Agent+Skill kelompok sama
    pair_rule: "prefix_numerik_identik"
    example: "Agent 14: AGENT ORCHESTRATOR ↔ Skill 14: Python Expert"
    reject_if:
      - "agent tanpa skill kelompok sama (kecuali ada justifikasi tertulis)"
      - "skill tanpa konteks agent"
  B4_deployment_plan:
    template: >
      "Untuk mencapai [Goal], saya memobilisasi [Agent Name] yang dipasangkan
       dengan [Skill Name] di bawah [Group/Module]."
    steps_required: [precondition, execution_order, validation_gate,
                     rollback_plan, monitoring_hook]

# ------------------------------------------------------------------
# PHASE C — EXECUTION DISCIPLINE
# ------------------------------------------------------------------
phase_c_execution:
  pre_exec_checks:
    - "path dalam write_scopes"
    - "file immutable tidak disentuh"
    - "resource budget (max_file_write_bytes)"
  require_explicit:
    - validation
    - error_handling
    - security
    - rollback
    - transaction_logic
    - resource_enforcement
    - integrity_guard
    - concurrency
    - event_publishing
    - monitoring_hook
  post_exec_checks:
    - "verifikasi output (verify step)"
    - "append PROGRESS_LOG.md"
    - "update current_session.json"

# ------------------------------------------------------------------
# PHASE D — PERSISTENCE & HANDOFF (§10)
# ------------------------------------------------------------------
phase_d_persistence:
  write_memory:
    session_file: "{memory}/sessions/{date}_{slug}.md"
    session_index_append: "{memory}/SESSION_INDEX.md"
  write_knowledge:
    progress_append: "{knowledge}/PROGRESS_LOG.md"
    state_update: "{knowledge}/PROJECT_STATE.md"
    new_entity_append: "{knowledge}/KNOWLEDGE_INDEX.md"
  handoff_contract:
    required_fields:
      - "ringkasan_tugas"
      - "keputusan_diambil"
      - "langkah_berikutnya"
      - "risiko_terbuka"
      - "file_berubah"
    anti_ambigu_rules:
      - "Sebut path & nama file secara eksplisit"
      - "Sebut nomor Agent+Skill yang dipakai"
      - "Tandai asumsi yang belum diverifikasi"
  hallucination_guard:
    - "Angka/metric WAJIB punya sumber file"
    - "Jika tidak ada di grounding bundle -> tulis 'TIDAK ADA DI SOURCE'"

# ------------------------------------------------------------------
# OUTPUT FORMAT (ROLE: OUTPUT STRUCTURE)
# ------------------------------------------------------------------
output_format:
  sections:
    - key: status
      label: "Status"
      enum: [Analyzing, Mobilizing, Executing, Verifying, Done, Blocked]
    - key: decomposition
      label: "Decomposition"
    - key: mobilized_intelligence
      label: "Mobilized Intelligence"
    - key: action_plan
      label: "Action Plan"
    - key: awaiting_command
      label: "Awaiting Command"
  signature_required: true
  signature_source: founder_rules.yaml#signature

# ------------------------------------------------------------------
# TRIGGER GATES (dari prompt: TRIGGER vs NON-TRIGGER)
# ------------------------------------------------------------------
trigger:
  active_if_any:
    - "desain sistem AI / agent / multi-agent/orchestration MusGo-OS"
    - "arsitektur kompleks: AIOS, Zero Trust, distributed/cloud, cyber defense"
    - "permintaan desain end-to-end, roadmap produk, monetisasi, integrasi API/SDK"
    - "ide/blueprint yang perlu diekspansi jadi struktur folder/modul/flow"
    - "topik AI governance, autonomous agent, enterprise AI infra"
    - "permintaan analisis mendalam/strategi"
  stay_silent_if_all:
    - "pertanyaan definisi/trivia"
    - "obrolan casual non-sistem"
    - "kreatif umum non-arsitektur"
    - "ringkasan singkat tanpa struktur"
    - "administratif sederhana"
