# ============================================================
# MusGo-OS 2in1 — AGENTS & SKILLS REGISTRY CONFIG
# File    : /home/Project-Progress/config/agents_skills_registry.yaml
# Sumber  : {home}/Agents-Skills/INDEX_AGENTS_SKILLS.md (145 entri)
# Aturan  : Agent↔Skill Duality — pair berdasarkan prefix numerik identik
# ============================================================

version: "1.0.0"
index_path: "{agents_skills_index}"
root_path: "{agents_skills_root}"
entry_format: "| Nomor | Jenis | Nama File | Kelompok |"
total_groups: 76                # kelompok 0..75
external_collections: 53        # folder tanpa prefix (skill pack eksternal)

# ------------------------------------------------------------------
# NOMENKLATUR WAJIB DALAM OUTPUT
# ------------------------------------------------------------------
nomenclature:
  format: "Agent {n}: {NAMA_AGENT} + Skill {n}: {NAMA_SKILL} [kelompok {n}]"
  example: "Agent 14: AGENT ORCHESTRATOR + Skill 14: Python Expert"
  rule: "Nomor & nama HARUS persis dari index — dilarang mengarang nomor."

# ------------------------------------------------------------------
# PAIRING POLICY
# ------------------------------------------------------------------
pairing:
  duality_enforced: true
  pairing_key: "prefix_numerik"
  if_skill_missing:
    action: "pakai skill ext di folder '0. MusGo-OS_2in1_Skills' atau koleksi eksternal + catat gap"
  if_agent_missing:
    action: "wajib kanonik: Agent 14 AGENT ORCHESTRATOR sebagai penanggung jawab + catat gap"
  swarm_rules:
    max_primary: 3
    allow_swarm: true                 # jika kompleks -> swarm multi-pair
    swarm_requires: [coordinator_pair, conflict_resolution, trust_scoring]

